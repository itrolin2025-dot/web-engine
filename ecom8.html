<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Product Grid Layout</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#faf8f5] font-sans antialiased text-gray-900 py-12 px-4 sm:px-6 lg:px-8">

    <section class="max-w-7xl mx-auto">
        <!-- 3-COLUMN PRODUCT GRID -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8 items-stretch">

            <!-- ================= CARD 1: GUATEMALA ================= -->
            <div class="flex flex-col border border-gray-200/80 bg-[#f9f7f4]">
                <!-- Image Header Area -->
                <div
                    class="relative aspect-square w-full bg-[#b2adab] flex items-center justify-center p-6 overflow-hidden">
                    <!-- Background Wave Pattern -->
                    <svg class="absolute inset-0 w-full h-full text-white/30 pointer-events-none" viewBox="0 0 400 400"
                        fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M-20,120 C100,180 200,60 420,200 M-20,140 C100,200 200,80 420,220 M-20,160 C100,220 200,100 420,240 M-20,180 C100,240 200,120 420,260" />
                    </svg>

                    <!-- Coffee Bag Image -->
                    <img src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=600&q=80"
                        alt="Guatemala Blue Ayarza" class="relative z-10 max-h-[85%] object-contain drop-shadow-xl" />
                </div>

                <!-- Product Details -->
                <div class="p-6 flex-1 flex flex-col justify-between space-y-6">
                    <div class="space-y-2">
                        <h3 class="text-sm font-semibold tracking-wide uppercase text-gray-900">
                            GUATEMALA, BLUE AYARZA
                        </h3>
                        <p class="text-xs font-semibold tracking-widest text-gray-400 uppercase">
                            WASHED
                        </p>
                        <p class="text-xs text-gray-500 font-normal pt-2">
                            green apple, cherry, caramel, chocolate
                        </p>
                    </div>

                    <!-- Bottom Price & Action -->
                    <div class="flex items-end justify-between pt-2">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase tracking-wider">From</span>
                            <span class="text-xs font-semibold text-gray-900">12.50 €</span>
                        </div>
                        <button
                            class="px-5 py-1.5 border border-[#897398] text-[#897398] text-[11px] font-medium tracking-wider hover:bg-[#897398] hover:text-white transition duration-200">
                            SHOW
                        </button>
                    </div>
                </div>
            </div>


            <!-- ================= CARD 2: BRAZIL (MEDIUM) ================= -->
            <div class="flex flex-col border border-gray-200/80 bg-[#f9f7f4]">
                <!-- Image Header Area -->
                <div
                    class="relative aspect-square w-full bg-[#dfdedd] flex items-center justify-center p-6 overflow-hidden">
                    <!-- Badge Top Left -->
                    <div class="absolute top-3 left-3 z-20">
                        <span
                            class="bg-white px-2.5 py-1 text-[10px] font-medium tracking-wider uppercase text-gray-800 shadow-xs">
                            MEDIUM
                        </span>
                    </div>

                    <!-- Background Wave Pattern -->
                    <svg class="absolute inset-0 w-full h-full text-white/40 pointer-events-none" viewBox="0 0 400 400"
                        fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M-20,120 C100,180 200,60 420,200 M-20,140 C100,200 200,80 420,220 M-20,160 C100,220 200,100 420,240 M-20,180 C100,240 200,120 420,260" />
                    </svg>

                    <!-- Coffee Bag Image -->
                    <img src="https://images.unsplash.com/photo-1589396575653-c09c794ff6a6?auto=format&fit=crop&w=600&q=80"
                        alt="Brazil Cerrado Mineiro Medium"
                        class="relative z-10 max-h-[85%] object-contain drop-shadow-xl" />
                </div>

                <!-- Product Details -->
                <div class="p-6 flex-1 flex flex-col justify-between space-y-6">
                    <div class="space-y-2">
                        <h3 class="text-sm font-semibold tracking-wide uppercase text-gray-900">
                            BRAZIL, CERRADO MINEIRO
                        </h3>
                        <p class="text-xs font-semibold tracking-widest text-gray-400 uppercase">
                            NATURAL
                        </p>
                        <p class="text-xs text-gray-500 font-normal pt-2">
                            milk chocolate, hazelnuts, dried fruit
                        </p>
                    </div>

                    <!-- Bottom Price & Action -->
                    <div class="flex items-end justify-between pt-2">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase tracking-wider">From</span>
                            <span class="text-xs font-semibold text-gray-900">11.00 €</span>
                        </div>
                        <button
                            class="px-5 py-1.5 border border-[#897398] text-[#897398] text-[11px] font-medium tracking-wider hover:bg-[#897398] hover:text-white transition duration-200">
                            SHOW
                        </button>
                    </div>
                </div>
            </div>


            <!-- ================= CARD 3: BRAZIL (MEDIUM-DARK / NEW) ================= -->
            <div class="flex flex-col border border-gray-200/80 bg-[#f9f7f4]">
                <!-- Image Header Area -->
                <div
                    class="relative aspect-square w-full bg-[#ded2c6] flex items-center justify-center p-6 overflow-hidden">
                    <!-- Badges Top Left -->
                    <div class="absolute top-3 left-3 z-20 flex items-center space-x-1.5">
                        <span
                            class="bg-[#f05a28] px-2.5 py-1 text-[10px] font-medium tracking-wider uppercase text-white">
                            NEW
                        </span>
                        <span
                            class="bg-[#2c2727] px-2.5 py-1 text-[10px] font-medium tracking-wider uppercase text-white">
                            MEDIUM-DARK
                        </span>
                    </div>

                    <!-- Background Wave Pattern -->
                    <svg class="absolute inset-0 w-full h-full text-white/35 pointer-events-none" viewBox="0 0 400 400"
                        fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M-20,120 C100,180 200,60 420,200 M-20,140 C100,200 200,80 420,220 M-20,160 C100,220 200,100 420,240 M-20,180 C100,240 200,120 420,260" />
                    </svg>

                    <!-- Coffee Bag Image -->
                    <img src="https://images.unsplash.com/photo-1611854779393-1b2da9d400fe?auto=format&fit=crop&w=600&q=80"
                        alt="Brazil Cerrado Mineiro Medium Dark"
                        class="relative z-10 max-h-[85%] object-contain drop-shadow-xl" />
                </div>

                <!-- Product Details -->
                <div class="p-6 flex-1 flex flex-col justify-between space-y-6">
                    <div class="space-y-2">
                        <h3 class="text-sm font-semibold tracking-wide uppercase text-gray-900">
                            BRAZIL, CERRADO MINEIRO
                        </h3>
                        <p class="text-xs font-semibold tracking-widest text-gray-400 uppercase">
                            NATURAL
                        </p>
                        <p class="text-xs text-gray-500 font-normal pt-2">
                            dark chocolate, roasted nuts
                        </p>
                    </div>

                    <!-- Bottom Price & Action -->
                    <div class="flex items-end justify-between pt-2">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase tracking-wider">From</span>
                            <span class="text-xs font-semibold text-gray-900">11.00 €</span>
                        </div>
                        <button
                            class="px-5 py-1.5 border border-[#897398] text-[#897398] text-[11px] font-medium tracking-wider hover:bg-[#897398] hover:text-white transition duration-200">
                            SHOW
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
