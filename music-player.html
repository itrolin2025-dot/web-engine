<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Releases - Responsive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ededed;
            color: #222222;
            padding: 40px 16px 120px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .header-title {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #555555;
            margin-bottom: 40px;
        }

        .track-list {
            display: flex;
            flex-direction: column;
        }

        .track-card {
            border-bottom: 1px dotted #cccccc;
            transition: background-color 0.2s ease;
        }

        .track-card:first-child {
            border-top: 1px dotted #cccccc;
        }

        .track-main {
            display: flex;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
        }

        .track-number {
            width: 45px;
            font-size: 0.9rem;
            color: #333333;
            font-weight: 500;
            padding-left: 6px;
            flex-shrink: 0;
        }

        .track-cover {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .track-title-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #111111;
            line-height: 1.3;
        }

        .accordion-icon {
            display: none;
            width: 16px;
            height: 16px;
            fill: #777777;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: auto;
        }

        .track-meta-desktop {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-right: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #555555;
        }

        .track-meta-desktop span {
            white-space: nowrap;
        }

        .preview-btn {
            background-color: #dcdcdc;
            border: none;
            border-radius: 30px;
            padding: 9px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #222222;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .preview-btn:hover {
            background-color: #cfcfcf;
        }

        .preview-btn.playing {
            background-color: #222222;
            color: #ffffff;
        }

        .preview-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* Accordion Drawer for Mobile Details */
        .track-accordion-content {
            display: none;
            padding: 0 0 16px 81px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #666666;
            flex-direction: column;
            gap: 6px;
        }

        .track-card.expanded .track-accordion-content {
            display: flex;
        }

        .track-card.expanded .accordion-icon {
            transform: rotate(180deg);
        }

        /* Sticky Bottom Player */
        .global-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            padding: 12px 24px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 16px;
            width: calc(100% - 32px);
            max-width: 650px;
            border: 1px solid #e2e8f0;
            z-index: 1000;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            width: 140px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .player-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.72rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            appearance: none;
            background: #e2e8f0;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #222;
            cursor: pointer;
        }

        .time-text {
            font-size: 0.7rem;
            color: #666;
            min-width: 32px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .track-meta-desktop {
                gap: 14px;
                font-size: 0.7rem;
                margin-right: 10px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 24px;
            }

            .header-title {
                margin-bottom: 24px;
                font-size: 0.75rem;
            }

            .track-number {
                display: none;
                /* Hide release number on mobile */
            }

            .track-meta-desktop {
                display: none;
                /* Hide desktop meta on mobile */
            }

            .accordion-icon {
                display: inline-block;
                /* Show accordion toggle on mobile */
            }

            .track-cover {
                width: 55px;
                height: 55px;
                border-radius: 10px;
            }

            .track-accordion-content {
                padding-left: 71px;
                /* Align with cover image margin */
            }

            .preview-btn {
                padding: 8px 14px;
                font-size: 0.7rem;
            }

            .player-info {
                width: 110px;
            }
        }

        @media (max-width: 480px) {
            .track-main {
                gap: 12px;
            }

            .track-cover {
                width: 48px;
                height: 48px;
            }

            .track-title {
                font-size: 0.85rem;
            }

            .track-accordion-content {
                padding-left: 60px;
            }

            .preview-btn {
                padding: 7px 12px;
                font-size: 0.65rem;
                gap: 4px;
            }

            .player-info {
                display: none;
                /* Hide title info in player on very small screens to fit progress bar nicely */
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-title">ALL RELEASES — ORDERED BY NEWEST FIRST</div>

        <div class="track-list" id="trackList">
            <!-- Playlist items generated by JS -->
        </div>
    </div>

    <!-- Sticky Bottom Player -->
    <div class="global-player" id="globalPlayer">
        <div class="player-info">
            <span class="player-title" id="playerTitle">Pilih Lagu...</span>
            <span class="player-artist" id="playerArtist">-</span>
        </div>
        <div class="progress-bar-container">
            <span class="time-text" id="currentTime">0:00</span>
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" step="0.1">
            <span class="time-text" id="duration">0:00</span>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const songs = [
            {
                num: '011',
                title: 'HOLD OUT HOPE',
                date: 'SEPTEMBER 2025',
                type: 'SINGLE, 4 SONGS',
                durationText: '12 MINUTES 22 SECONDS',
                cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=150&auto=format&fit=crop&q=80',
                src: './Kuntry Boy - Anno Domini Beats.mp3',
                artist: 'Anno Domini Beats'
            },
            {
                num: '010',
                title: 'WANNA GET TO KNOW YOU',
                date: 'SEPTEMBER 2022',
                type: 'SINGLE, 1 SONG',
                durationText: '3 MINUTES 19 SECONDS',
                cover: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=150&auto=format&fit=crop&q=80',
                src: './Wildfire - Jessie Villa.mp3',
                artist: 'Jessie Villa'
            },
            {
                num: '009',
                title: 'JUST A MEMORY (STRIPPED)',
                date: 'JANUARY 2021',
                type: 'SINGLE, 1 SONG',
                durationText: '3 MINUTES 49 SECONDS',
                cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=150&auto=format&fit=crop&q=80',
                src: './audio1.mp3',
                artist: 'Local Artist'
            }
        ];

        let currentTrackIndex = -1;
        let expandedTrackIndex = -1;

        const audioPlayer = document.getElementById('audioPlayer');
        const trackList = document.getElementById('trackList');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        function renderTracks() {
            trackList.innerHTML = '';
            songs.forEach((song, index) => {
                const isPlaying = index === currentTrackIndex && !audioPlayer.paused;
                const isExpanded = index === expandedTrackIndex;

                const card = document.createElement('div');
                card.className = `track-card ${isExpanded ? 'expanded' : ''}`;
                card.innerHTML = `
                    <div class="track-main">
                        <div class="track-number">${song.num}</div>
                        <img src="${song.cover}" alt="${song.title}" class="track-cover">
                        <div class="track-title-wrapper" onclick="toggleAccordion(${index})">
                            <span class="track-title">${song.title}</span>
                            <svg class="accordion-icon" viewBox="0 0 24 24">
                                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                            </svg>
                        </div>
                        <div class="track-meta-desktop">
                            <span>${song.date}</span>
                            <span>${song.type}</span>
                            <span>${song.durationText}</span>
                        </div>
                        <button class="preview-btn ${isPlaying ? 'playing' : ''}" onclick="togglePlay(event, ${index})">
                            <svg viewBox="0 0 24 24">
                                ${isPlaying
                        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
                        : '<polygon points="5,3 19,12 5,21"/>'}
                            </svg>
                            ${isPlaying ? 'PAUSE' : 'PREVIEW'}
                        </button>
                    </div>
                    <div class="track-accordion-content">
                        <div>📅 ${song.date}</div>
                        <div>🎵 ${song.type}</div>
                        <div>⏱️ ${song.durationText}</div>
                    </div>
                `;
                trackList.appendChild(card);
            });
        }

        function toggleAccordion(index) {
            // Hanya aktifkan accordion pada screen kecil
            if (window.innerWidth <= 768) {
                expandedTrackIndex = expandedTrackIndex === index ? -1 : index;
                renderTracks();
            }
        }

        function togglePlay(event, index) {
            event.stopPropagation();
            if (currentTrackIndex === index) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
            } else {
                currentTrackIndex = index;
                const song = songs[currentTrackIndex];
                audioPlayer.src = song.src;
                playerTitle.textContent = song.title;
                playerArtist.textContent = song.artist || song.date;
                audioPlayer.play().catch(err => console.log("Gagal pemutaran:", err));
            }
            renderTracks();
        }

        audioPlayer.addEventListener('play', renderTracks);
        audioPlayer.addEventListener('pause', renderTracks);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        audioPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % songs.length;
            const song = songs[currentTrackIndex];
            audioPlayer.src = song.src;
            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist || song.date;
            audioPlayer.play();
            renderTracks();
        });

        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                const seekTime = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Render awal
        renderTracks();
    </script>
</body>

</html>
