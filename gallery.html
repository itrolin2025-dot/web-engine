<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scent Collection Slider</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Swiper.js CSS (Library Slider Populer) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .swiper-slide {
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0.5;
            scale: 0.9;
        }

        .swiper-slide-active {
            opacity: 1;
            scale: 1;
        }
    </style>
</head>

<body class="bg-[#F4EFEA] text-gray-900 min-h-screen py-12 px-4">

    <div class="max-w-4xl mx-auto text-center">
        <!-- Judul dari JSON -->
        <h1 id="section-title" class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-8">
            A Scent For Every Personality
        </h1>

        <!-- SWIPER SLIDER CONTAINER -->
        <div class="swiper mySwiper py-6">
            <div class="swiper-wrapper" id="slider-wrapper">
                <!-- Slide Item akan di-generate oleh JS dari Data JSON -->
            </div>

            <!-- Tombol Navigasi Slider -->
            <div class="swiper-button-next text-gray-800"></div>
            <div class="swiper-button-prev text-gray-800"></div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Detail Produk yang Dipilih dari Slider -->
        <div id="product-detail"
            class="mt-8 bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-gray-100 max-w-xl mx-auto transition-all">
            <span id="prod-category"
                class="text-xs font-bold uppercase tracking-widest text-amber-700 bg-amber-50 px-3 py-1 rounded-full">
                Extrait de Parfum
            </span>
            <h2 id="prod-name" class="text-2xl font-bold mt-3 mb-1">Date Night</h2>
            <p id="prod-price" class="text-lg font-semibold text-gray-700 mb-4">Rp 100.000</p>
            <p id="prod-desc" class="text-sm text-gray-600 leading-relaxed">
                Pilih produk di atas untuk melihat deskripsi lengkap.
            </p>
        </div>
    </div>

    <!-- Swiper.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // Data JSON Anda
        const jsonData = {
            "title": "A Scent For Every Personality",
            "products": [
                {
                    "kode": "fresh fruity",
                    "categories": "Extrait de Parfum",
                    "name": "Date Night",
                    "desc": "Aroma fruity, fresh, dan green notes langsung memberikan kesan segar yang ringan dan menyenangkan. Berlanjut ke aroma inti yaitu floral berpadu dengan fruity dan sentuhan amber yang hangat.",
                    "price": "Rp 100.000",
                    "image": "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=600&auto=format&fit=crop"
                },
                {
                    "kode": "fresh",
                    "categories": "Extrait de Parfum",
                    "name": "Breezy Girl",
                    "desc": "Perpaduan fruity, green notes, dan sentuhan floral menghadirkan kesan segar yang bersih, seperti habis mandi. Berlanjut ke aroma floral yang dipadukan dengan green dan ambery.",
                    "price": "Rp 100.000",
                    "image": "https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=600&auto=format&fit=crop"
                },
                {
                    "kode": "fruity floral",
                    "categories": "Extrait de Parfum",
                    "name": "Peppy Cheerleader",
                    "desc": "Perpaduan manis dan segar dari buah pear, peach dan berries membuka aroma ini dengan kesan yang langsung memikat. Diikuti oleh kelembutan floral khususnya aroma Lily.",
                    "price": "Rp 100.000",
                    "image": "https://images.unsplash.com/photo-1523293182086-7651a899d37f?q=80&w=600&auto=format&fit=crop"
                },
                {
                    "kode": "fruity",
                    "categories": "Extrait de Parfum",
                    "name": "4Ever Young",
                    "desc": "Perpaduan aroma segar dari fruity, cucumber, dan green notes memberikan kesan ringan dan watery yang menyegarkan. Berlanjut ke sentuhan floral dengan green dan watermelon.",
                    "price": "Rp 100.000",
                    "image": "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?q=80&w=600&auto=format&fit=crop"
                }
            ]
        };

        // Render Gambar ke dalam Slider
        const sliderWrapper = document.getElementById('slider-wrapper');
        jsonData.products.forEach((prod, index) => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide cursor-pointer';
            slide.innerHTML = `
                <div class="bg-white p-3 rounded-2xl shadow-md border border-gray-100 overflow-hidden">
                    <img src="${prod.image}" alt="${prod.name}" class="w-full h-64 object-cover rounded-xl" />
                    <h3 class="font-bold text-center mt-3 text-sm tracking-wide uppercase">${prod.name}</h3>
                </div>
            `;
            sliderWrapper.appendChild(slide);
        });

        // Inisialisasi Library Swiper.js
        const swiper = new Swiper(".mySwiper", {
            slidesPerView: 1.3,
            centeredSlides: true,
            spaceBetween: 20,
            loop: true,
            breakpoints: {
                640: { slidesPerView: 2.2 },
                1024: { slidesPerView: 3 }
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            on: {
                // Event ketika slide digeser/diubah
                slideChange: function () {
                    const activeIndex = this.realIndex;
                    updateProductDetail(jsonData.products[activeIndex]);
                }
            }
        });

        // Fungsi untuk memperbarui tampilan detail saat slider digeser
        function updateProductDetail(product) {
            document.getElementById('prod-name').innerText = product.name;
            document.getElementById('prod-category').innerText = product.categories;
            document.getElementById('prod-price').innerText = product.price;
            document.getElementById('prod-desc').innerText = product.desc;
        }

        // Set detail awal ke produk pertama
        updateProductDetail(jsonData.products[0]);
    </script>
</body>

</html>
