<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolty - Bolos e Doces</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Fraunces (swash serif), Dancing Script (script), Montserrat (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Dancing+Script:wght@500;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .font-display {
            font-family: 'Fraunces', serif;
            font-variation-settings: "SOFT" 80, "WONK" 1;
        }

        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        .font-sans-custom {
            font-family: 'Montserrat', sans-serif;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        /* Striped badge (circle 1) */
        .stripes-bg {
            background: repeating-linear-gradient(90deg,
                    #507EE2 0 16px,
                    #FFA7C5 16px 30px,
                    #EFE4C8 30px 38px);
        }

        /* Badge hover effects */
        .brand-badge {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
        }

        .brand-badge:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body class="bg-[#EFE4C8] m-0 p-0 overflow-x-hidden font-sans-custom antialiased selection:bg-[#FFA7C5] selection:text-[#B92B45]">

    <!-- Main Full Width Layout -->
    <div class="w-full min-h-screen flex flex-col">

        <!-- ================= SECTION 1: CREAM HERO (#EFE4C8) ================= -->
        <section class="w-full bg-[#EFE4C8] relative pt-20 md:pt-32 pb-0 px-6 sm:px-12 flex flex-col items-center justify-between overflow-hidden">

            <!-- Decorative Hand-Drawn Fork (Top Left, royal blue line art) -->
            <div class="absolute top-6 left-6 sm:top-10 sm:left-14 md:top-14 md:left-24 w-20 sm:w-28 md:w-36 pointer-events-none select-none opacity-90" style="transform: rotate(-25deg);">
                <svg viewBox="0 0 84 210" fill="none" stroke="#507EE2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Fork head -->
                    <path d="M24 10 L60 10 L60 40 C60 53 51 60 42 62 C33 60 24 53 24 40 Z" />
                    <!-- Tine separators -->
                    <path d="M36 10 L36 36" />
                    <path d="M48 10 L48 36" />
                    <!-- Handle -->
                    <path d="M38 62 C36 100 37 150 40 194" />
                    <path d="M46 62 C48 100 47 150 44 194" />
                    <!-- Small bow on handle -->
                    <path d="M42 114 C33 107 24 112 28 119 C31 124 38 122 42 114 Z" />
                    <path d="M42 114 C51 107 60 112 56 119 C53 124 46 122 42 114 Z" />
                </svg>
            </div>

            <!-- Decorative Hand-Drawn Cake Slice (Top Right, royal blue line art + pink cherry) -->
            <div class="absolute top-8 right-6 sm:top-12 sm:right-14 md:top-16 md:right-24 w-32 sm:w-44 md:w-56 pointer-events-none select-none opacity-90" style="transform: rotate(12deg);">
                <svg viewBox="0 0 160 115" fill="none" stroke="#507EE2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Slice body -->
                    <path d="M20 92 L128 92 C141 86 147 64 134 52 L54 30 L20 92 Z" />
                    <!-- Frosting top line -->
                    <path d="M54 30 L126 48" />
                    <!-- Layer dash -->
                    <path d="M30 74 C62 66 102 70 140 68" stroke-dasharray="2 5" stroke-width="3.5" />
                    <!-- Cherry on top -->
                    <circle cx="106" cy="18" r="13" fill="#FFA7C5" stroke="#507EE2" stroke-width="4" />
                    <path d="M106 5 C109 -3 120 1 117 10" />
                    <!-- Tiny star inside cherry -->
                    <path d="M106 13 l2.2 4.6 5 .6 -3.7 3.4 1 5 -4.5 -2.5 -4.5 2.5 1 -5 -3.7 -3.4 5 -.6 Z" fill="#507EE2" stroke="none" />
                </svg>
            </div>

            <!-- Main Big Logo "Dolty" -->
            <div class="my-16 md:my-24 text-center relative z-10 max-w-4xl mx-auto px-4">
                <h1 class="font-display italic font-semibold text-8xl sm:text-9xl md:text-[11rem] lg:text-[13rem] text-[#B92B45] leading-none tracking-[-0.02em] select-none drop-shadow-sm">
                    Dolty
                </h1>
            </div>

            <!-- Scalloped Wavy Transition into Section 2 (Cream into Crimson, exact candy.html navbar wave) -->
            <div class="absolute -bottom-[18px] left-0 w-full overflow-hidden leading-none z-20 pointer-events-none">
                <svg viewBox="0 0 1200 24" preserveAspectRatio="none" class="w-full h-5 sm:h-6 block" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M0,0 C30,20 60,20 90,0 C120,20 150,20 180,0 C210,20 240,20 270,0 C300,20 330,20 360,0 C390,20 420,20 450,0 C480,20 510,20 540,0 C570,20 600,20 630,0 C660,20 690,20 720,0 C750,20 780,20 810,0 C840,20 870,20 900,0 C930,20 960,20 990,0 C1020,20 1050,20 1080,0 C1110,20 1140,20 1170,0 C1200,20 1230,20 1260,0 L1200,0 L0,0 Z"
                        fill="#EFE4C8"></path>
                </svg>
            </div>
        </section>

        <!-- ================= SECTION 2: CRIMSON STRIP (#B92B45) ================= -->
        <section class="w-full bg-[#B92B45] px-6 sm:px-12 pt-10 sm:pt-14 pb-12 sm:pb-16 relative flex flex-col items-center">

            <!-- 2 Big Badges in Crimson Section -->
            <div class="w-full max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6 sm:gap-8 items-center justify-center">

                <!-- Badge 1: Rounded Rect Pill "bolos e doces Dolty" (Left - 7 cols) -->
                <div class="md:col-span-7 bg-[#EFE4C8] rounded-[36px] sm:rounded-[44px] md:rounded-[52px] p-8 sm:p-10 flex flex-col items-center justify-center brand-badge min-h-[180px] sm:min-h-[220px] relative">
                    <!-- Curved tagline -->
                    <span class="font-script font-bold text-xl sm:text-2xl text-[#B92B45] -rotate-6 mb-1 select-none">
                        bolos e doces
                    </span>

                    <!-- Logo with Bow -->
                    <div class="flex items-center justify-center relative">
                        <span class="font-display italic font-semibold text-5xl sm:text-6xl md:text-7xl text-[#FFA7C5] tracking-[-0.02em] leading-none select-none">
                            Dolty
                        </span>
                        <!-- Crimson Bow (line art) -->
                        <svg class="w-9 sm:w-11 absolute -right-6 sm:-right-8 top-1/2 -translate-y-1/2 rotate-12" viewBox="0 0 48 32" fill="none" stroke="#B92B45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M24 16 C15 6 4 8 6 15 C7.5 20.5 16 21 24 16 Z" />
                            <path d="M24 16 C33 6 44 8 42 15 C40.5 20.5 32 21 24 16 Z" />
                            <path d="M22 18 L16 28 M26 18 L32 28" />
                            <circle cx="24" cy="16" r="2.6" fill="#B92B45" stroke="none" />
                        </svg>
                    </div>
                </div>

                <!-- Badge 2: Circle Monogram "DD" (Right - 5 cols) -->
                <div class="md:col-span-5 bg-[#EFE4C8] rounded-full aspect-square flex items-center justify-center brand-badge relative p-6 max-w-[200px] sm:max-w-[240px] md:max-w-[260px] mx-auto w-full">
                    <!-- Interlocking Monogram DD (royal blue) -->
                    <div class="relative font-display italic font-semibold text-[#507EE2] leading-none tracking-tighter select-none">
                        <span class="text-6xl sm:text-7xl md:text-8xl inline-block">D</span>
                        <span class="text-6xl sm:text-7xl md:text-8xl inline-block absolute left-[52%] top-[24%]">D</span>
                    </div>
                    <!-- Pink Bow (top right) -->
                    <svg class="w-8 sm:w-10 absolute top-4 right-4 sm:top-5 sm:right-5 rotate-[25deg]" viewBox="0 0 48 32" fill="none" stroke="#FFA7C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M24 16 C15 6 4 8 6 15 C7.5 20.5 16 21 24 16 Z" />
                        <path d="M24 16 C33 6 44 8 42 15 C40.5 20.5 32 21 24 16 Z" />
                        <circle cx="24" cy="16" r="2.8" fill="#FFA7C5" stroke="none" />
                    </svg>
                    <!-- Cherries (bottom left, filled) -->
                    <svg class="w-12 sm:w-14 absolute bottom-3 left-3 sm:bottom-4 sm:left-4" viewBox="0 0 44 44" fill="none" stroke="#FFA7C5" stroke-width="2.6" stroke-linecap="round">
                        <path d="M20 7 C16 12 13.5 18 13 25" />
                        <path d="M20 7 C24 12 27 18 27.5 26" />
                        <path d="M20 7 C25 3 31 3 34 6 C30 10 23 10 20 7 Z" fill="#FFA7C5" stroke="none" />
                        <circle cx="12.5" cy="31" r="7" fill="#FFA7C5" stroke="none" />
                        <circle cx="28" cy="32" r="6" fill="#FFA7C5" stroke="none" />
                    </svg>
                </div>

            </div>

            <!-- Scalloped Wavy Transition into Section 3 (Crimson into Pink, exact candy.html navbar wave) -->
            <div class="absolute -bottom-[18px] left-0 w-full overflow-hidden leading-none z-20 pointer-events-none">
                <svg viewBox="0 0 1200 24" preserveAspectRatio="none" class="w-full h-5 sm:h-6 block" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M0,0 C30,20 60,20 90,0 C120,20 150,20 180,0 C210,20 240,20 270,0 C300,20 330,20 360,0 C390,20 420,20 450,0 C480,20 510,20 540,0 C570,20 600,20 630,0 C660,20 690,20 720,0 C750,20 780,20 810,0 C840,20 870,20 900,0 C930,20 960,20 990,0 C1020,20 1050,20 1080,0 C1110,20 1140,20 1170,0 C1200,20 1230,20 1260,0 L1200,0 L0,0 Z"
                        fill="#B92B45"></path>
                </svg>
            </div>
        </section>

        <!-- ================= SECTION 3: SOFT PINK STRIP (#FFA7C5) ================= -->
        <section class="w-full bg-[#FFA7C5] px-6 sm:px-12 pt-10 sm:pt-14 pb-12 sm:pb-16 relative">

            <!-- 3 Circular Badges Row -->
            <div class="max-w-3xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-6 sm:gap-8 items-center justify-center">

                <!-- Circle 1: Striped Badge with Crimson DD Monogram -->
                <div class="stripes-bg aspect-square rounded-full flex items-center justify-center brand-badge relative overflow-hidden max-w-[200px] sm:max-w-none mx-auto w-full">
                    <span class="font-display italic font-semibold text-5xl sm:text-5xl md:text-6xl text-[#B92B45] tracking-tighter leading-none select-none drop-shadow-[0_2px_0_rgba(239,228,200,0.6)]">
                        D<span class="inline-block -ml-3 translate-y-1.5">D</span>
                    </span>
                </div>

                <!-- Circle 2: Solid Crimson Badge with Cream Dolty Logo -->
                <div class="aspect-square bg-[#B92B45] rounded-full flex flex-col items-center justify-center brand-badge p-5 relative text-center max-w-[200px] sm:max-w-none mx-auto w-full">
                    <span class="font-display italic font-semibold text-4xl sm:text-4xl md:text-5xl text-[#EFE4C8] tracking-[-0.02em] leading-none select-none">
                        Dolty
                    </span>
                    <!-- Tiny Pink Bow -->
                    <svg class="w-7 sm:w-8 mt-2 -rotate-6" viewBox="0 0 48 32" fill="#FFA7C5">
                        <path d="M24 16 C15 6 4 8 6 15 C7.5 20.5 16 21 24 16 Z" />
                        <path d="M24 16 C33 6 44 8 42 15 C40.5 20.5 32 21 24 16 Z" />
                        <circle cx="24" cy="16" r="3.4" />
                    </svg>
                </div>

                <!-- Circle 3: Scalloped Flower Badge with Cake Lineart -->
                <div class="aspect-square rounded-full flex items-center justify-center brand-badge max-w-[200px] sm:max-w-none mx-auto w-full">
                    <svg class="w-full h-full" viewBox="0 0 100 100" fill="none">
                        <!-- Outer scalloped ring (crimson stroke) -->
                        <path d="M90,50 A16,16 0 0 1 78.3,78.3 A16,16 0 0 1 50,90 A16,16 0 0 1 21.7,78.3 A16,16 0 0 1 10,50 A16,16 0 0 1 21.7,21.7 A16,16 0 0 1 50,10 A16,16 0 0 1 78.3,21.7 A16,16 0 0 1 90,50 Z"
                            stroke="#B92B45" stroke-width="1.6" />
                        <!-- Cream filled flower (scaled) -->
                        <g transform="translate(50 50) scale(0.84) translate(-50 -50)">
                            <path d="M90,50 A16,16 0 0 1 78.3,78.3 A16,16 0 0 1 50,90 A16,16 0 0 1 21.7,78.3 A16,16 0 0 1 10,50 A16,16 0 0 1 21.7,21.7 A16,16 0 0 1 50,10 A16,16 0 0 1 78.3,21.7 A16,16 0 0 1 90,50 Z"
                                fill="#EFE4C8" stroke="#B92B45" stroke-width="1.2" />
                        </g>
                        <!-- Cake slice line art (pink, same shape as hero cake) -->
                        <g transform="translate(50 55) scale(0.40) translate(-80 -62)" stroke="#FFA7C5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 92 L128 92 C141 86 147 64 134 52 L54 30 L20 92 Z" />
                            <path d="M54 30 L126 48" />
                            <path d="M30 74 C62 66 102 70 140 68" stroke-dasharray="4 9" stroke-width="7" />
                        </g>
                        <!-- Cherry on top (crimson) -->
                        <circle cx="63" cy="23" r="4.5" fill="#B92B45" />
                        <path d="M63 18.5 C63.5 14.5 67.5 15 66.5 18.5" stroke="#B92B45" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>

            </div>

            <!-- Scalloped Wavy Transition into Footer (Pink into Cream Footer, exact candy.html navbar wave) -->
            <div class="absolute -bottom-[18px] left-0 w-full overflow-hidden leading-none z-20 pointer-events-none">
                <svg viewBox="0 0 1200 24" preserveAspectRatio="none" class="w-full h-5 sm:h-6 block" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M0,0 C30,20 60,20 90,0 C120,20 150,20 180,0 C210,20 240,20 270,0 C300,20 330,20 360,0 C390,20 420,20 450,0 C480,20 510,20 540,0 C570,20 600,20 630,0 C660,20 690,20 720,0 C750,20 780,20 810,0 C840,20 870,20 900,0 C930,20 960,20 990,0 C1020,20 1050,20 1080,0 C1110,20 1140,20 1170,0 C1200,20 1230,20 1260,0 L1200,0 L0,0 Z"
                        fill="#FFA7C5"></path>
                </svg>
            </div>
        </section>

        <!-- ================= FOOTER: COLOR SWATCHES BAR ================= -->
        <footer class="w-full bg-[#EFE4C8]">
            <div class="w-full grid grid-cols-5">

                <!-- Swatch 1: Cream #EFE4C8 -->
                <div class="bg-[#EFE4C8] h-48 sm:h-64 md:h-80 rounded-t-3xl sm:rounded-t-[36px] md:rounded-t-[48px] flex flex-col justify-end items-center pb-6 md:pb-8 transition-transform hover:-translate-y-2">
                    <span class="vertical-text font-sans-custom font-bold text-xs sm:text-sm md:text-base text-[#B92B45] tracking-widest uppercase select-none">
                        #EFE4C8
                    </span>
                </div>

                <!-- Swatch 2: Crimson #B92B45 -->
                <div class="bg-[#B92B45] h-48 sm:h-64 md:h-80 rounded-t-3xl sm:rounded-t-[36px] md:rounded-t-[48px] flex flex-col justify-end items-center pb-6 md:pb-8 transition-transform hover:-translate-y-2">
                    <span class="vertical-text font-sans-custom font-bold text-xs sm:text-sm md:text-base text-[#EFE4C8] tracking-widest uppercase select-none">
                        #B92B45
                    </span>
                </div>

                <!-- Swatch 3: Soft Pink #FFA7C5 -->
                <div class="bg-[#FFA7C5] h-48 sm:h-64 md:h-80 rounded-t-3xl sm:rounded-t-[36px] md:rounded-t-[48px] flex flex-col justify-end items-center pb-6 md:pb-8 transition-transform hover:-translate-y-2">
                    <span class="vertical-text font-sans-custom font-bold text-xs sm:text-sm md:text-base text-[#B92B45] tracking-widest uppercase select-none">
                        #FFA7C5
                    </span>
                </div>

                <!-- Swatch 4: Sky Blue #75A2F2 -->
                <div class="bg-[#75A2F2] h-48 sm:h-64 md:h-80 rounded-t-3xl sm:rounded-t-[36px] md:rounded-t-[48px] flex flex-col justify-end items-center pb-6 md:pb-8 transition-transform hover:-translate-y-2">
                    <span class="vertical-text font-sans-custom font-bold text-xs sm:text-sm md:text-base text-[#EFE4C8] tracking-widest uppercase select-none">
                        #75A2F2
                    </span>
                </div>

                <!-- Swatch 5: Royal Blue #507EE2 -->
                <div class="bg-[#507EE2] h-48 sm:h-64 md:h-80 rounded-t-3xl sm:rounded-t-[36px] md:rounded-t-[48px] flex flex-col justify-end items-center pb-6 md:pb-8 transition-transform hover:-translate-y-2">
                    <span class="vertical-text font-sans-custom font-bold text-xs sm:text-sm md:text-base text-[#EFE4C8] tracking-widest uppercase select-none">
                        #507EE2
                    </span>
                </div>

            </div>
        </footer>

    </div>

</body>

</html>
