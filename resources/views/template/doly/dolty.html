<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolty - Bento Brand & Packaging Showcase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Fraunces, Dancing Script, Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .font-display {
            font-family: 'Fraunces', serif;
            font-variation-settings: "SOFT" 80, "WONK" 1;
        }

        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        .font-sans-custom {
            font-family: 'Montserrat', sans-serif;
        }

        /* 3D floating effect for cards & badges */
        .bento-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.14);
        }

        .sticker-badge {
            transition: transform 0.25s ease;
        }

        .sticker-badge:hover {
            transform: scale(1.06) rotate(2deg);
        }
    </style>
</head>

<body class="bg-[#FFA7C5] min-h-screen py-5 md:py-8 px-2.5 sm:px-4 md:px-6 font-sans-custom antialiased selection:bg-[#507EE2] selection:text-white">

    <!-- Top Social & Tagline Bar -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between text-xs sm:text-sm font-bold tracking-wider text-[#B92B45] uppercase mb-4 px-2 sm:px-4">
        <span class="hover:opacity-75 transition-opacity cursor-pointer">@CLARADESIGN.CO</span>
        <div class="border-2 border-[#B92B45] rounded-full px-4 sm:px-6 py-1 font-extrabold text-[10px] sm:text-xs tracking-wider shadow-sm bg-white/20 backdrop-blur-sm">
            BRANDING & DESIGN MEMORÁVEIS
        </div>
        <span class="hover:opacity-75 transition-opacity cursor-pointer hidden sm:inline">@CLARADESIGN.CO</span>
    </header>

    <!-- Main Bento Grid Container (Separated Modular Cards, Closer to Edges) -->
    <main class="w-full max-w-6xl mx-auto space-y-4 md:space-y-6">

        <!-- ================= BENTO CARD 1: CREAM HERO (#EFE4C8) ================= -->
        <div class="w-full bg-[#EFE4C8] rounded-[28px] sm:rounded-[36px] md:rounded-[44px] p-8 sm:p-12 md:p-16 flex flex-col items-center justify-center relative overflow-hidden shadow-sm border-2 border-white/60 bento-card">

            <!-- Decorative Hand-Drawn Cake (Top Left) -->
            <div class="absolute top-4 left-4 sm:top-8 sm:left-10 md:top-10 md:left-16 w-20 sm:w-28 md:w-36 pointer-events-none select-none -rotate-6 opacity-90">
                <svg viewBox="0 0 140 100" fill="none" stroke="#FFA7C5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15,75 L115,75 C125,70 130,50 120,40 L40,25 L15,75 Z" />
                    <path d="M40,25 L110,30" />
                    <circle cx="95" cy="18" r="10" fill="#FFA7C5" stroke="#FFA7C5" stroke-width="2" />
                    <path d="M95,8 C98,2 105,4 103,11" />
                </svg>
            </div>

            <!-- Decorative Star Sticker (Top Right) -->
            <div class="absolute top-4 right-4 sm:top-8 sm:right-10 md:top-10 md:right-16 w-14 sm:w-18 md:w-22 text-[#B92B45] rotate-12 drop-shadow-md pointer-events-none select-none">
                <svg viewBox="0 0 100 100" fill="currentColor">
                    <path d="M50,5 L63,35 L95,38 L70,60 L78,92 L50,75 L22,92 L30,60 L5,38 L37,35 Z" />
                </svg>
            </div>

            <!-- Big Main Logo "Dolty" in Royal Blue -->
            <div class="my-4 sm:my-8 md:my-10 text-center relative z-10 select-none">
                <h1 class="font-display italic font-semibold text-7xl sm:text-9xl md:text-[10rem] lg:text-[12rem] text-[#507EE2] leading-none tracking-[-0.02em] flex items-center justify-center relative drop-shadow-sm">
                    Dolty
                    <!-- Soft Pink Ribbon/Bow around 'y' -->
                    <svg class="w-10 sm:w-14 md:w-18 absolute -right-6 sm:-right-10 md:-right-12 top-1/2 -translate-y-1/2 rotate-12" viewBox="0 0 48 32" fill="none" stroke="#FFA7C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M24 16 C15 6 4 8 6 15 C7.5 20.5 16 21 24 16 Z" />
                        <path d="M24 16 C33 6 44 8 42 15 C40.5 20.5 32 21 24 16 Z" />
                        <circle cx="24" cy="16" r="3.2" fill="#FFA7C5" stroke="none" />
                    </svg>
                </h1>
            </div>

        </div>

        <!-- ================= BENTO ROW 2: 2 SPLIT SHOWCASE CARDS ================= -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">

            <!-- Card A: Royal Blue (#507EE2) with Coffee Cup Mockup -->
            <div class="bg-[#507EE2] rounded-[28px] sm:rounded-[36px] md:rounded-[44px] p-6 sm:p-10 md:p-12 flex flex-col items-center justify-center relative min-h-[280px] sm:min-h-[340px] md:min-h-[380px] overflow-hidden shadow-sm border-2 border-white/40 bento-card group">
                <!-- Floating Sticker "TYSM pelo seu pedido" -->
                <div class="absolute top-4 left-4 sm:top-6 sm:left-6 z-20 sticker-badge cursor-pointer">
                    <div class="bg-[#EFE4C8] border-2 border-white rounded-2xl px-4 py-2 shadow-lg flex flex-col items-center">
                        <span class="font-display italic font-extrabold text-2xl sm:text-3xl text-[#B92B45] leading-none tracking-tight">
                            TYSM
                        </span>
                        <span class="bg-[#507EE2] text-white text-[9px] sm:text-[10px] font-extrabold px-3 py-0.5 rounded-full uppercase tracking-wider mt-0.5 shadow-sm">
                            pelo seu pedido
                        </span>
                    </div>
                </div>

                <!-- Coffee Cup Mockup Placeholder -->
                <div class="relative w-full max-w-xs aspect-[4/5] bg-white/20 rounded-3xl border-2 border-dashed border-white/40 flex flex-col items-center justify-center p-6 backdrop-blur-sm group-hover:border-white/70 transition-all shadow-inner mt-6 sm:mt-0">
                    <img src="/images/default/broken.png" alt="Dolty Coffee Cup" class="max-h-32 sm:max-h-40 object-contain opacity-90 group-hover:scale-105 transition-transform">
                    <span class="mt-4 text-xs sm:text-sm font-bold text-white uppercase text-center font-display italic tracking-wider">Dolty Café Takeaway</span>
                </div>
            </div>

            <!-- Card B: Crimson (#B92B45) with Donut Sleeve Mockup -->
            <div class="bg-[#B92B45] rounded-[28px] sm:rounded-[36px] md:rounded-[44px] p-6 sm:p-10 md:p-12 flex flex-col items-center justify-center relative min-h-[280px] sm:min-h-[340px] md:min-h-[380px] overflow-hidden shadow-sm border-2 border-white/40 bento-card group">
                <!-- Donut Package Mockup Placeholder -->
                <div class="relative w-full max-w-xs aspect-[4/5] bg-white/20 rounded-3xl border-2 border-dashed border-white/40 flex flex-col items-center justify-center p-6 backdrop-blur-sm group-hover:border-white/70 transition-all shadow-inner">
                    <img src="/images/default/broken.png" alt="Donut Package" class="max-h-32 sm:max-h-40 object-contain opacity-90 group-hover:scale-105 transition-transform">
                    <span class="mt-4 text-xs sm:text-sm font-bold text-white uppercase text-center font-display italic tracking-wider">Donut Bakery Box</span>
                </div>
            </div>

        </div>

        <!-- ================= BENTO ROW 3: 4 CIRCLE HIGHLIGHT BADGES ================= -->
        <div class="bg-[#EFE4C8] rounded-[24px] sm:rounded-[32px] md:rounded-[40px] py-6 sm:py-8 px-4 sm:px-8 md:px-12 flex flex-wrap items-center justify-around gap-4 sm:gap-6 shadow-sm border-2 border-white/60 bento-card">

            <!-- Circle 1: Solid Crimson "Dolty no delivery" -->
            <div class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-full bg-[#B92B45] text-white flex flex-col items-center justify-center text-center p-2 sticker-badge cursor-pointer shadow-md">
                <span class="font-display italic font-semibold text-sm sm:text-base leading-none">Dolty no</span>
                <span class="font-script font-bold text-base sm:text-lg -mt-0.5 text-[#FFA7C5]">delivery</span>
            </div>

            <!-- Circle 2: Typography Pattern "inspos" -->
            <div class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-full bg-[#FFA7C5] border-2 sm:border-4 border-[#B92B45] text-[#B92B45] flex items-center justify-center text-center p-2 sticker-badge cursor-pointer overflow-hidden shadow-md">
                <span class="font-display italic font-extrabold text-xs sm:text-sm md:text-base leading-tight tracking-tighter uppercase">
                    inspo<br>inspos<br>inspo
                </span>
            </div>

            <!-- Circle 3: Menu Clipboard Icon -->
            <div class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-full bg-[#FFA7C5] border-2 sm:border-4 border-[#B92B45] flex items-center justify-center p-1.5 sticker-badge cursor-pointer shadow-md">
                <div class="w-full h-full bg-[#EFE4C8] rounded-full flex flex-col items-center justify-center p-2 text-[#B92B45]">
                    <span class="text-[9px] sm:text-[11px] font-extrabold uppercase tracking-tighter border-b border-[#B92B45] pb-0.5">MENU</span>
                    <span class="text-sm sm:text-base mt-0.5">📋</span>
                </div>
            </div>

            <!-- Circle 4: Sync / Refresh Arrows Circle -->
            <div class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-full bg-[#507EE2] flex items-center justify-center p-1.5 sticker-badge cursor-pointer shadow-md">
                <div class="w-full h-full bg-[#EFE4C8] rounded-full flex items-center justify-center text-[#FFA7C5]">
                    <svg class="w-8 h-8 sm:w-10 sm:h-10 text-[#FFA7C5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                    </svg>
                </div>
            </div>

        </div>

        <!-- ================= BENTO ROW 4: PACKAGING SHOWCASE (#EFE4C8) ================= -->
        <div class="w-full bg-[#EFE4C8] rounded-[28px] sm:rounded-[36px] md:rounded-[44px] p-8 sm:p-12 md:p-16 relative overflow-hidden flex flex-col items-center justify-center shadow-sm border-2 border-white/60 bento-card">

            <!-- Background Lineart Fork with Bow (Left) -->
            <div class="absolute -left-4 top-8 w-36 sm:w-48 text-[#507EE2] opacity-80 -rotate-12 pointer-events-none select-none">
                <svg viewBox="0 0 84 210" fill="none" stroke="#507EE2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M24 10 L60 10 L60 40 C60 53 51 60 42 62 C33 60 24 53 24 40 Z" />
                    <path d="M36 10 L36 36" />
                    <path d="M48 10 L48 36" />
                    <path d="M38 62 C36 100 37 150 40 194" />
                    <path d="M46 62 C48 100 47 150 44 194" />
                    <path d="M42 114 C33 107 24 112 28 119 C31 124 38 122 42 114 Z" fill="#FFA7C5" stroke="#FFA7C5" />
                    <path d="M42 114 C51 107 60 112 56 119 C53 124 46 122 42 114 Z" fill="#FFA7C5" stroke="#FFA7C5" />
                </svg>
            </div>

            <!-- Background Lineart Cake (Right) -->
            <div class="absolute -right-6 bottom-8 w-48 sm:w-64 text-[#FFA7C5] opacity-80 rotate-6 pointer-events-none select-none">
                <svg viewBox="0 0 140 100" fill="none" stroke="#FFA7C5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15,75 L115,75 C125,70 130,50 120,40 L40,25 L15,75 Z" />
                    <path d="M40,25 L110,30" />
                    <circle cx="95" cy="18" r="10" fill="#FFA7C5" stroke="#FFA7C5" stroke-width="2" />
                </svg>
            </div>

            <!-- Packaging Mockup Cards (Box & Bag) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 w-full max-w-3xl relative z-10 mb-8">

                <!-- Packaging 1: Cake Box Mockup -->
                <div class="bg-white/70 backdrop-blur-sm border-2 border-dashed border-[#507EE2]/40 rounded-3xl sm:rounded-[36px] p-6 sm:p-8 flex flex-col items-center justify-center text-center min-h-[180px] sm:min-h-[220px] sticker-badge">
                    <img src="/images/default/broken.png" alt="Cake Box Packaging" class="max-h-24 sm:max-h-32 object-contain opacity-90">
                    <span class="text-xs sm:text-sm font-bold text-[#507EE2] uppercase mt-4 font-display italic tracking-wide">Specialty Cake Box</span>
                </div>

                <!-- Packaging 2: Striped Paper Bag Mockup -->
                <div class="bg-white/70 backdrop-blur-sm border-2 border-dashed border-[#B92B45]/40 rounded-3xl sm:rounded-[36px] p-6 sm:p-8 flex flex-col items-center justify-center text-center min-h-[180px] sm:min-h-[220px] sticker-badge">
                    <img src="/images/default/broken.png" alt="Paper Bag Packaging" class="max-h-24 sm:max-h-32 object-contain opacity-90">
                    <span class="text-xs sm:text-sm font-bold text-[#B92B45] uppercase mt-4 font-display italic tracking-wide">Striped Delivery Bag</span>
                </div>

            </div>

            <!-- Bottom CTA Pill Button: "VEJA COMPLETO AQUI:" -->
            <a href="#complete" class="relative z-20 bg-[#B92B45] hover:bg-[#9E2037] text-white font-extrabold text-xs sm:text-sm tracking-wider uppercase px-8 sm:px-12 py-3.5 sm:py-4 rounded-full shadow-lg transform hover:scale-105 transition-all text-center">
                VEJA COMPLETO AQUI:
            </a>

        </div>

    </main>

</body>

</html>
