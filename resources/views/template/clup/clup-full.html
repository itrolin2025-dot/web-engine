<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUP - Good Coffee Great Vibes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Titan One, Fredoka, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Titan+One&display=swap" rel="stylesheet">
    <style>
        .font-bubble {
            font-family: 'Titan One', 'Fredoka', cursive, sans-serif;
        }

        .font-chunky {
            font-family: 'Fredoka', sans-serif;
        }

        .font-sans-custom {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Scalloped Star/Flower Badge */
        .scalloped-badge {
            clip-path: polygon(
                50% 0%, 63% 10%, 79% 5%, 86% 20%, 99% 25%, 97% 41%, 100% 57%, 91% 70%, 93% 87%, 77% 93%, 68% 100%, 50% 95%, 32% 100%, 23% 93%, 7% 87%, 9% 70%, 0% 57%, 3% 41%, 1% 25%, 14% 20%, 21% 5%, 37% 10%
            );
        }

        /* Hover animations */
        .bento-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .bento-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 36px -10px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body class="bg-white min-h-screen m-0 p-4 sm:p-6 md:p-8 lg:p-10 flex flex-col font-sans-custom antialiased selection:bg-[#F5B82E] selection:text-[#1346A0]">

    <!-- Full Screen Container -->
    <div class="w-full max-w-[1600px] mx-auto flex-1 flex flex-col justify-between">

        <!-- ================= NAVBAR ================= -->
        <header class="w-full flex items-center justify-between pb-6 sm:pb-8">
            <!-- Brand Logo -->
            <a href="#" class="font-bubble text-3xl sm:text-4xl text-[#1346A0] tracking-tight lowercase">
                blup
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center space-x-10 text-sm sm:text-base font-bold text-[#1346A0]">
                <a href="#" class="hover:text-[#E63C78] transition-colors">Home</a>
                <a href="#" class="hover:text-[#E63C78] transition-colors">About</a>
                <a href="#" class="hover:text-[#E63C78] transition-colors">Menu</a>
                <a href="#" class="hover:text-[#E63C78] transition-colors">Contact</a>
            </nav>

            <!-- Order Now CTA Button -->
            <a href="#" class="bg-[#1346A0] hover:bg-[#0e3782] text-white font-bold text-xs sm:text-sm px-6 sm:px-8 py-3 rounded-full shadow-md hover:shadow-lg transition-all">
                Order Now
            </a>
        </header>


        <!-- ================= MAIN HERO BENTO GRID (FULL SCREEN) ================= -->
        <div class="w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 md:gap-7 items-stretch">

            <!-- ================= LEFT BENTO: PINK HERO CARD (7 cols) ================= -->
            <div class="lg:col-span-7 bg-[#E63C78] rounded-[32px] sm:rounded-[44px] p-8 sm:p-12 md:p-14 lg:p-16 text-white relative overflow-hidden bento-card flex flex-col justify-between min-h-[520px] sm:min-h-[580px] lg:min-h-[620px]">
                
                <!-- Background Image (User can replace with custom image) -->
                <div class="absolute inset-0 bg-cover bg-center opacity-30 pointer-events-none" style="background-image: url('/images/default/broken.png');"></div>

                <!-- Top Row: Badge Flower -->
                <div class="w-full flex justify-end relative z-10">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-[#F5B82E] text-[#E63C78] scalloped-badge flex items-center justify-center font-bubble text-xl sm:text-2xl md:text-3xl shadow-md rotate-12">
                        B
                    </div>
                </div>

                <!-- Middle Content: Big Chunky Headline -->
                <div class="relative z-10 my-auto max-w-lg">
                    <h1 class="font-bubble text-5xl sm:text-7xl md:text-8xl lg:text-[84px] leading-[0.92] tracking-tight uppercase drop-shadow-sm">
                        GOOD<br>
                        COFFEE<br>
                        GREAT<br>
                        VIBES
                    </h1>
                </div>

                <!-- Floating Drink/Latte Background Graphic Container on Bottom Right -->
                <div class="absolute right-[-10%] sm:right-0 bottom-[-10px] sm:bottom-0 w-[55%] sm:w-[50%] h-[75%] pointer-events-none z-10 flex items-end justify-center">
                    <!-- Background image container for Iced Coffee Splash -->
                    <div class="w-full h-full bg-contain bg-bottom bg-no-repeat" style="background-image: url('/images/default/broken.png');"></div>
                </div>

                <!-- Bottom Row: Subtitle & CTA Button -->
                <div class="relative z-20 mt-6 max-w-xs sm:max-w-sm space-y-5">
                    <p class="text-xs sm:text-sm md:text-base text-white/95 leading-relaxed font-semibold">
                        Freshly brewed coffee and oven-baked pastries, served daily to make every moment a little warmer.
                    </p>
                    <a href="#" class="inline-flex items-center gap-2 bg-white hover:bg-neutral-50 text-[#E63C78] font-bubble text-sm sm:text-base px-7 sm:px-9 py-3.5 sm:py-4 rounded-full shadow-lg transition-transform hover:scale-105">
                        <span>Order Now</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M7 17L17 7M17 7H7M17 7V17" />
                        </svg>
                    </a>
                </div>

            </div>


            <!-- ================= RIGHT BENTO: 2 STACKED CARDS (5 cols) ================= -->
            <div class="lg:col-span-5 flex flex-col gap-5 sm:gap-6 md:gap-7 justify-between">

                <!-- ===== CARD 1 (TOP): BLUE "TOP PICK" CARD ===== -->
                <div class="flex-1 bg-[#1346A0] rounded-[28px] sm:rounded-[40px] p-7 sm:p-9 md:p-10 text-white relative overflow-hidden bento-card flex flex-col justify-between min-h-[250px] sm:min-h-[280px]">
                    
                    <!-- Background Image (User can replace with custom image) -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-25 pointer-events-none" style="background-image: url('/images/default/broken.png');"></div>

                    <!-- Top Row: Label & Scalloped Badge -->
                    <div class="flex items-start justify-between relative z-10">
                        <div>
                            <h2 class="font-bubble text-2xl sm:text-3xl md:text-4xl tracking-tight uppercase leading-none">
                                TOP<br>PICK
                            </h2>
                        </div>
                        <!-- Yellow Badge -->
                        <div class="w-11 h-11 sm:w-13 sm:h-13 md:w-14 md:h-14 bg-[#F5B82E] text-[#1346A0] scalloped-badge flex items-center justify-center font-bubble text-lg sm:text-xl shadow-sm">
                            B
                        </div>
                    </div>

                    <!-- Right Side Croissant & Cup Graphic Container -->
                    <div class="absolute right-3 bottom-0 w-[45%] h-[80%] pointer-events-none z-10 flex items-end justify-center">
                        <div class="w-full h-full bg-contain bg-bottom bg-no-repeat" style="background-image: url('/images/default/broken.png');"></div>
                    </div>

                    <!-- Bottom Content: Description, Button, and Price -->
                    <div class="relative z-20 mt-4 max-w-[60%] space-y-3 sm:space-y-4">
                        <p class="text-[11px] sm:text-xs md:text-sm text-white/90 leading-snug font-medium">
                            The perfect match for your favorite coffee.
                        </p>
                        <div>
                            <a href="#" class="inline-flex items-center gap-1.5 bg-[#F5B82E] hover:bg-[#e2a720] text-[#1346A0] font-bold text-xs sm:text-sm px-4 sm:px-5 py-1.5 sm:py-2 rounded-full shadow transition-all">
                                <span>Order Now</span>
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M7 17L17 7M17 7H7M17 7V17" />
                                </svg>
                            </a>
                        </div>
                        <div class="font-bubble text-3xl sm:text-4xl md:text-5xl text-[#E63C78] tracking-tight pt-1">
                            $4.00
                        </div>
                    </div>

                </div>


                <!-- ===== CARD 2 (BOTTOM): YELLOW "BAKED FRESH" CARD ===== -->
                <div class="flex-1 bg-[#F5B82E] rounded-[28px] sm:rounded-[40px] p-7 sm:p-9 md:p-10 text-[#1346A0] relative overflow-hidden bento-card flex flex-col justify-between min-h-[250px] sm:min-h-[280px]">
                    
                    <!-- Background Image (User can replace with custom image) -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-25 pointer-events-none" style="background-image: url('/images/default/broken.png');"></div>

                    <!-- Top Row: Label & Scalloped Badge -->
                    <div class="flex items-start justify-between relative z-10">
                        <div>
                            <h2 class="font-bubble text-2xl sm:text-3xl md:text-4xl tracking-tight uppercase leading-none">
                                BAKED<br>FRESH
                            </h2>
                        </div>
                        <!-- Blue Badge -->
                        <div class="w-11 h-11 sm:w-13 sm:h-13 md:w-14 md:h-14 bg-[#1346A0] text-[#F5B82E] scalloped-badge flex items-center justify-center font-bubble text-lg sm:text-xl shadow-sm">
                            B
                        </div>
                    </div>

                    <!-- Right Side Floating Croissants Graphic Container -->
                    <div class="absolute right-2 bottom-0 w-[55%] h-[85%] pointer-events-none z-10 flex items-end justify-center">
                        <div class="w-full h-full bg-contain bg-bottom bg-no-repeat" style="background-image: url('/images/default/broken.png');"></div>
                    </div>

                    <!-- Bottom Content: Description -->
                    <div class="relative z-20 mt-4 max-w-[55%]">
                        <p class="text-xs sm:text-sm md:text-base text-[#1346A0]/90 font-bold leading-relaxed">
                            Crunch outside, soft inside.
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
